name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight check dependencies
        run: python -m pip install numpy pandas scikit-learn Pillow nbformat
      - name: Validate source and data workflow
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
